name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Cache Rust dependencies
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/cache
            ~/.cargo/registry/index
            ~/.cargo/git/db
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps
            target/x86_64-unknown-linux-gnu/release/.fingerprint
            target/x86_64-unknown-linux-gnu/release/build
            target/x86_64-unknown-linux-gnu/release/deps
            target/aarch64-unknown-linux-gnu/release/.fingerprint
            target/aarch64-unknown-linux-gnu/release/build
            target/aarch64-unknown-linux-gnu/release/deps
          key: rust-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-release-${{ runner.os }}-

      - name: Cache Cross
        id: cross-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ~/.cargo/bin/cross
          key: cross-${{ runner.os }}-55f847251389c5406df85579191c0eac412fab3a

      - name: Test
        run: |
          cargo test --locked
          cargo clippy --locked --all-targets -- -D warnings

      - name: Install Cross
        if: steps.cross-cache.outputs.cache-hit != 'true'
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 55f847251389c5406df85579191c0eac412fab3a --locked

      - name: Build
        run: |
          cross build --release --locked --target x86_64-unknown-linux-gnu
          cross build --release --locked --target aarch64-unknown-linux-gnu

      - name: Package
        run: |
          mkdir dist
          stage=$(mktemp -d)
          for target in x86_64-unknown-linux-gnu aarch64-unknown-linux-gnu; do
            asset="dummy-bot-${GITHUB_REF_NAME}-${target}"
            package="${stage}/${asset}"
            mkdir -p "${package}/systemd"
            install -m 0755 "target/${target}/release/rust_discord_bot" "dist/${asset}"
            install -m 0755 "dist/${asset}" "${package}/rust_discord_bot"
            install -m 0755 deploy.sh "${package}/deploy.sh"
            install -m 0644 LICENSE README.md README.vi.md .env.example .deploy.env.example config.env "${package}/"
            install -m 0644 systemd/discord-bot.service.template "${package}/systemd/"
            tar -czf "dist/${asset}.tar.gz" -C "${stage}" "${asset}"
          done

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
