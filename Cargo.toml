[package]
name = "rust_discord_bot"
version = "3.0.1"
edition = "2024"
description = "High-performance modular Discord bot in Rust with Rhai scripting core"

[dependencies]
# Discord framework
poise = "0.6.2"

# Async runtime
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }

# Structured logging
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Database (SQLite)
sqlx = { version = "0.9.0", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite-bundled"] }

# Error handling
anyhow = "1.0.104"

# Environment variables
dotenvy = "0.15.7"

# Chrono for timestamps
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
chrono-tz = "0.10.4"

# Bounded Discord attachment downloads
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }

# TLS crypto provider used by Serenity
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }

# Rhai Scripting Engine (Up to date v1.25.1 with sync + serde)
rhai = { version = "1.25.1", features = ["sync", "serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
